name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: easyteaching_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test_user -d easyteaching_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python scripts/check_repository_hygiene.py
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
      - run: pip install -r requirements-linux.lock pip-audit
      - run: pip check
      - run: python scripts/audit_dependencies.py
      - run: python -m pytest -q
      - run: node tests/test_answer_render_queue.cjs && node tests/test_workspace_browser.cjs
      - run: python scripts/run_evals.py --min-pass-rate 1
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/easyteaching_test
      - run: python -m pytest -q tests/test_postgres_redis_integration.py
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/easyteaching_test
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
      - run: docker build -t easyteaching:check .
